name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: Build frontend (Vite)
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found"
            exit 1
          fi
          echo "Build output verified successfully"

      - name: Check for secrets in code
        run: |
          # Verificar que no hay secretos en el código
          if grep -r "DATABASE_URL.*=" src/ --include="*.ts" --include="*.tsx"; then
            echo "Error: DATABASE_URL found in frontend code"
            exit 1
          fi
          if grep -r "SESSION_SECRET.*=" src/ --include="*.ts" --include="*.tsx"; then
            echo "Error: SESSION_SECRET found in frontend code"
            exit 1
          fi
          echo "No secrets found in frontend code"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Verificar que no hay archivos sensibles
          if [ -f ".env" ] || [ -f ".env.local" ]; then
            echo "Error: .env or .env.local files found"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Verify .gitignore
        run: |
          if ! grep -q ".env.local" .gitignore; then
            echo "Warning: .env.local not in .gitignore"
          fi
          if ! grep -q ".env" .gitignore; then
            echo "Warning: .env not in .gitignore"
          fi
